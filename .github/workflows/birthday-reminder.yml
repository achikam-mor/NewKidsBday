name: Birthday Reminder

on:
  schedule:
    # Runs at 11:00 UTC (13:00 Jerusalem/UTC+2)
    - cron: '0 11 * * *'
  workflow_dispatch:
    # Allows manual triggering for testing

permissions:
  contents: write

jobs:
  check-birthdays:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run birthday checker
        run: node scripts/check-birthdays.js

      - name: Append 'a' to counter.txt
        run: printf 'a' >> counter.txt

      - name: Commit and push counter.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add counter.txt
          git commit -m "chore: append 'a' to counter.txt [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
